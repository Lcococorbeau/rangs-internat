<div class="brand-lockup">
  <span class="creator-signature">Conçu par <strong>Corentin Delhay</strong></span>
  <button class="thanks-link-fixed" id="thanksLink" type="button" aria-controls="thanksInfoOverlay" aria-expanded="false">Remerciements</button>
</div>

<div class="info-overlay thanks-info-overlay" id="thanksInfoOverlay" data-typewriter hidden>
  <button class="info-overlay-backdrop thanks-overlay-close" type="button" aria-label="Fermer"></button>
  <section class="info-overlay-content" role="dialog" aria-modal="true" aria-labelledby="thanksInfoTitle">
    <button class="info-overlay-close thanks-overlay-close" type="button" aria-label="Fermer">×</button>
    <h2 id="thanksInfoTitle">Remerciement</h2>
    <div class="typewriter-lines">
      <p data-type-line>Merci à tous ceux qui ont contribué au projet.</p>
      <p data-type-line>Léo Picat — simulations de 2024.</p>
      <p data-type-line>Victoria Méry et Mohamed Amine — simulations de 2026.</p>
    </div>
  </section>
</div>

<style>
  .top-nav {
    position: relative;
  }

  .thanks-link-fixed {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    color: var(--apple-blue, #0071e3);
    font-family: "Linotype Didot", "Didot LT Std", "Didot", "Bodoni 72", serif;
    font-size: .94rem;
    font-weight: 600;
    font-style: italic;
    letter-spacing: .012em;
    line-height: 1.08;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: pointer;
    white-space: nowrap;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .thanks-link-fixed:hover {
    color: #005bbb;
  }

  .thanks-link-fixed:focus-visible {
    outline: 3px solid rgba(0,113,227,.28);
    outline-offset: 4px;
    border-radius: 5px;
  }

  .thanks-info-overlay {
    z-index: 6200 !important;
  }

  @media (max-width: 820px) {
    .brand-lockup {
      width: 100%;
      justify-content: space-between;
      align-items: baseline;
      gap: 14px;
    }
  }

  @media (max-width: 520px) {
    .thanks-link-fixed {
      font-size: .90rem;
    }
  }
</style>

<script>
(() => {
  const isHomePage = () => {
    const path = window.location.pathname.replace(/\/+$/, '');
    return path === '' || path.endsWith('/index.html');
  };

  const initThanks = () => {
    const link = document.getElementById('thanksLink');
    const overlay = document.getElementById('thanksInfoOverlay');
    if (!link || !overlay) return;

    if (!isHomePage()) {
      link.remove();
      overlay.remove();
      return;
    }

    /* Seule la modale quitte la barre du haut. Le lien, lui, reste physiquement
       sur la même ligne que la signature : aucun calcul de position au scroll. */
    document.body.appendChild(overlay);

    let fallbackTimer = null;

    const stopFallbackTyping = () => {
      if (fallbackTimer) clearTimeout(fallbackTimer);
      fallbackTimer = null;
    };

    const fallbackType = () => {
      stopFallbackTyping();
      const lines = [...overlay.querySelectorAll('[data-type-line]')];
      lines.forEach(line => {
        if (!line.dataset.fullText) line.dataset.fullText = line.textContent.trim();
        line.textContent = '';
        line.classList.remove('typed');
      });

      let lineIndex = 0;
      let charIndex = 0;
      const step = () => {
        if (overlay.hidden || lineIndex >= lines.length) return;
        const line = lines[lineIndex];
        const full = line.dataset.fullText || '';
        if (charIndex === 0) line.classList.add('typed');
        line.textContent = full.slice(0, charIndex + 1);
        charIndex += 1;
        if (charIndex >= full.length) {
          lineIndex += 1;
          charIndex = 0;
          fallbackTimer = setTimeout(step, 150);
        } else {
          fallbackTimer = setTimeout(step, 13);
        }
      };
      fallbackTimer = setTimeout(step, 150);
    };

    const fallbackOpen = () => {
      overlay.hidden = false;
      document.documentElement.classList.add('info-overlay-open');
      requestAnimationFrame(() => {
        overlay.classList.add('open');
        fallbackType();
      });
    };

    const fallbackClose = () => {
      stopFallbackTyping();
      overlay.classList.remove('open');
      document.documentElement.classList.remove('info-overlay-open');
      setTimeout(() => { overlay.hidden = true; }, 180);
    };

    const open = () => {
      link.setAttribute('aria-expanded', 'true');
      if (window.RangsOverlays?.open) window.RangsOverlays.open(overlay);
      else fallbackOpen();
    };

    const close = () => {
      link.setAttribute('aria-expanded', 'false');
      if (window.RangsOverlays?.close) window.RangsOverlays.close(overlay);
      else fallbackClose();
    };

    link.addEventListener('click', open);
    overlay.querySelectorAll('.thanks-overlay-close').forEach(button => button.addEventListener('click', close));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !overlay.hidden) close();
    });
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initThanks, { once: true });
  else initThanks();
})();
</script>
