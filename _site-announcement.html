<div class="site-announcement" id="siteAnnouncement" hidden>
  <div class="site-announcement-bar" role="status" aria-live="polite">
    <span class="site-announcement-icon" aria-hidden="true">⚠</span>
    <p class="site-announcement-text">Le tour de simulation du jour sera mis en ligne en fin d’après-midi</p>
    <button class="site-announcement-close" id="siteAnnouncementClose" type="button" aria-label="Fermer l’annonce">×</button>
  </div>
</div>
<script>
(() => {
  const announcement = document.getElementById('siteAnnouncement');
  const closeButton = document.getElementById('siteAnnouncementClose');
  if (!announcement || !closeButton) return;

  const parts = new Intl.DateTimeFormat('en', {
    timeZone: 'Europe/Paris',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date());
  const date = Object.fromEntries(parts.map(part => [part.type, part.value]));
  const parisDate = `${date.year}-${date.month}-${date.day}`;

  /* Cette annonce est volontairement limitée au 2 septembre 2026. */
  if (parisDate !== '2026-09-02') return;

  const sessionKey = 'rangs-internat-annonce-tour-2026-09-02';
  try {
    if (sessionStorage.getItem(sessionKey) === '1') return;
    sessionStorage.setItem(sessionKey, '1');
  } catch (_) {}

  let timer = null;

  const hide = () => {
    clearTimeout(timer);
    announcement.classList.remove('show');
    announcement.classList.add('leaving');
    setTimeout(() => {
      announcement.hidden = true;
      announcement.classList.remove('leaving');
    }, 280);
  };

  announcement.hidden = false;
  requestAnimationFrame(() => announcement.classList.add('show'));
  timer = setTimeout(hide, 8000);

  closeButton.addEventListener('click', hide);
})();
</script>
